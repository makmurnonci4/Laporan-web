<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poster Laporan Kegiatan</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--c1:#4f46e5;--c2:#9333ea;--ht:#ffffff}
.accent-bg{background:var(--c1);color:var(--ht)}
.date-in{background:#0f172a;color:#f1f5f9;border-radius:.5rem;padding:.25rem .5rem;color-scheme:dark;border:1px solid #334155}
</style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex justify-center p-4">

<main class="w-full max-w-md bg-slate-900 rounded-3xl shadow-2xl overflow-hidden border border-slate-800 flex flex-col mb-10">

  <header class="p-6 text-center shadow-lg" style="background:linear-gradient(135deg,var(--c1),var(--c2));color:var(--ht)">
    <span class="bg-white/20 text-xs font-semibold px-3 py-1 rounded-full">Laporan Kegiatan & Dokumentasi</span>
    <input id="judul" value="Nama Kegiatan Anda" maxlength="80"
      class="mt-3 w-full bg-transparent text-center text-2xl font-black tracking-tight outline-none border-b border-dashed placeholder-current"
      style="border-color:color-mix(in srgb,currentColor 50%,transparent)" placeholder="Ketik nama kegiatan">
    <p id="tglTeks" class="text-sm font-semibold mt-3">📅 Pilih tanggal kegiatan</p>
    <div class="mt-2 flex flex-wrap items-center justify-center gap-2 text-xs">
      <input type="date" id="tgl1" class="date-in" aria-label="Tanggal mulai">
      <span id="sampai" class="hidden">s/d</span>
      <input type="date" id="tgl2" class="date-in hidden" aria-label="Tanggal selesai">
    </div>
    <label class="mt-2 inline-flex items-center gap-2 text-xs cursor-pointer">
      <input type="checkbox" id="rentang"> Kegiatan lebih dari satu hari
    </label>
    <div class="mt-3 flex items-center justify-center gap-2" role="group" aria-label="Pilih warna">
      <span class="text-xs mr-1">Warna:</span>
      <div id="warna" class="flex items-center gap-2"></div>
      <label class="w-7 h-7 rounded-full border-2 border-white/70 overflow-hidden cursor-pointer relative" title="Warna sendiri"
        style="background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)">
        <input type="color" id="warnaSendiri" value="#4f46e5" class="opacity-0 absolute inset-0 w-full h-full cursor-pointer">
      </label>
    </div>
  </header>

  <div class="p-6 space-y-6 flex-1">

    <!-- FOTO -->
    <section class="space-y-3">
      <div class="flex items-center justify-between">
        <h3 class="text-xs font-bold text-slate-400">📸 Foto Kegiatan <span id="cFoto">(0/6)</span></h3>
        <button id="btnFoto" class="text-xs font-semibold accent-bg hover:brightness-110 px-3 py-1.5 rounded-lg">+ Tambah Foto/PDF</button>
      </div>
      <input id="inFoto" type="file" accept=".jpg,.jpeg,.png,.pdf,image/jpeg,image/png,application/pdf" multiple class="hidden">
      <div id="gridFoto" class="grid grid-cols-2 gap-2"></div>
    </section>

    <!-- DOKUMEN -->
    <section class="space-y-3">
      <div class="flex items-center justify-between">
        <h3 class="text-xs font-bold text-slate-400">📁 Dokumen & Lampiran <span id="cDok">(0/4)</span></h3>
        <button id="btnDok" class="text-xs font-semibold accent-bg hover:brightness-110 px-3 py-1.5 rounded-lg">+ Tambah Dokumen</button>
      </div>
      <input id="inDok" type="file" accept=".doc,.docx,.xls,.xlsx,.pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" multiple class="hidden">
      <div id="listDok" class="space-y-2"></div>
    </section>

    <!-- SETELAH KIRIM -->
    <section id="terkirim" class="hidden space-y-3 bg-emerald-950/40 border border-emerald-800 rounded-2xl p-4">
      <h3 class="text-xs font-bold text-emerald-300">✅ Terkirim — lihat dokumen</h3>
      <div id="listLihat" class="space-y-2"></div>
    </section>
  </div>

  <footer class="p-6 bg-slate-900 border-t border-slate-800 space-y-3">
    <button id="btnKirim" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg shadow-emerald-900/30">
      Kirim Foto + Dokumen ke WhatsApp
    </button>
    <p class="text-[11px] text-slate-500 text-center">Di HP, file ikut terkirim langsung ke WhatsApp. Di komputer, hanya teks yang terkirim; file dilampirkan manual.</p>
  </footer>
</main>

<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 border border-slate-600 text-sm px-4 py-2 rounded-xl hidden max-w-[90%] text-center"></div>

<script>
const MAX = 4;      // dokumen
const MAXF = 6;     // foto
const S = { foto: [], dok: [] };
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.add('hidden'), 2800);
}
const ext = f => (f.name.match(/\.[^.]+$/) || [''])[0].toLowerCase();
const baseName = f => f.name.replace(/\.[^.]+$/, '');
const isPdf = f => f.type === 'application/pdf' || ext(f) === '.pdf';
function ikon(f) {
  const e = ext(f);
  if (e === '.pdf') return '📄';
  if (['.xls', '.xlsx'].includes(e)) return '📊';
  if (['.doc', '.docx', '.txt'].includes(e)) return '📝';
  if (['.ppt', '.pptx'].includes(e)) return '📽️';
  return '🖼️';
}
function lihat(item) {
  const e = ext(item.file);
  if (e === '.pdf' || item.file.type.startsWith('image/')) { window.open(item.url, '_blank'); return; }
  const a = document.createElement('a');
  a.href = item.url; a.download = (item.name || baseName(item.file)) + e; a.click();
  toast('File Word/Excel diunduh, buka dengan aplikasinya.');
}

/* ---------- FOTO ---------- */
function renderFoto() {
  $('cFoto').textContent = `(${S.foto.length}/${MAXF})`;
  $('btnFoto').disabled = S.foto.length >= MAXF;
  $('btnFoto').classList.toggle('opacity-40', S.foto.length >= MAXF);
  const g = $('gridFoto'); g.innerHTML = '';
  if (!S.foto.length) {
    g.innerHTML = '<div class="col-span-2 text-center text-xs text-slate-500 border border-dashed border-slate-700 rounded-xl py-8">Belum ada foto. Ketuk “Tambah Foto/PDF” (1–6 file, format JPG, PNG, atau PDF).</div>';
    return;
  }
  S.foto.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'relative rounded-xl overflow-hidden border border-slate-700 bg-slate-800';
    d.innerHTML = `
      <button class="block w-full aspect-video" data-v="${i}">${isPdf(p.file)
        ? `<div class="w-full h-full flex flex-col items-center justify-center gap-1 bg-slate-800"><span class="text-3xl">📄</span><span class="text-[10px] text-slate-300 px-2 truncate max-w-full">${esc(p.file.name)}</span></div>`
        : `<img src="${p.url}" alt="" class="w-full h-full object-cover">`}</button>
      <button data-x="${i}" class="absolute top-1 right-1 bg-black/70 hover:bg-red-600 rounded-full w-6 h-6 text-xs" aria-label="Hapus foto">✕</button>
      <input data-c="${i}" value="${esc(p.cap)}" maxlength="40" placeholder="Nama kegiatan"
        class="w-full bg-black/60 text-[11px] text-center text-slate-200 p-1.5 outline-none focus:bg-black">`;
    g.appendChild(d);
  });
}
$('gridFoto').addEventListener('click', e => {
  const v = e.target.closest('[data-v]'), x = e.target.closest('[data-x]');
  if (v) window.open(S.foto[v.dataset.v].url, '_blank');
  if (x) { URL.revokeObjectURL(S.foto[x.dataset.x].url); S.foto.splice(x.dataset.x, 1); renderFoto(); }
});
$('gridFoto').addEventListener('input', e => {
  if (e.target.dataset.c !== undefined) S.foto[e.target.dataset.c].cap = e.target.value;
});
$('btnFoto').onclick = () => $('inFoto').click();
$('inFoto').onchange = e => {
  for (const f of e.target.files) {
    if (!['.jpg', '.jpeg', '.png', '.pdf'].includes(ext(f))) { toast(f.name + ': hanya JPG, PNG, atau PDF.'); continue; }
    if (S.foto.length >= MAXF) { toast('Maksimal 6 foto.'); break; }
    S.foto.push({ file: f, url: URL.createObjectURL(f), cap: 'Kegiatan ' + (S.foto.length + 1) });
  }
  e.target.value = ''; renderFoto();
};

/* ---------- DOKUMEN ---------- */
function renderDok() {
  $('cDok').textContent = `(${S.dok.length}/${MAX})`;
  $('btnDok').disabled = S.dok.length >= MAX;
  $('btnDok').classList.toggle('opacity-40', S.dok.length >= MAX);
  const l = $('listDok'); l.innerHTML = '';
  if (!S.dok.length) {
    l.innerHTML = '<div class="text-center text-xs text-slate-500 border border-dashed border-slate-700 rounded-xl py-6">Belum ada dokumen. Ketuk “Tambah Dokumen” (maks. 4; Word, Excel, PDF, JPG, atau PNG).</div>';
    return;
  }
  S.dok.forEach((d, i) => {
    const r = document.createElement('div');
    r.className = 'flex items-center gap-2 p-3 bg-slate-800 rounded-xl border border-slate-700';
    r.innerHTML = `
      <span class="text-xl">${ikon(d.file)}</span>
      <div class="flex-1 min-w-0">
        <input data-n="${i}" value="${esc(d.name)}" maxlength="60" class="w-full bg-transparent text-xs font-bold text-slate-200 outline-none border-b border-dashed border-slate-600 focus:border-indigo-400" placeholder="Nama dokumen">
        <p class="text-[10px] text-slate-400 mt-0.5">${ext(d.file).slice(1).toUpperCase()} · ${(d.file.size / 1024).toFixed(0)} KB</p>
      </div>
      <button data-v="${i}" class="text-xs text-blue-400 hover:underline">Lihat</button>
      <button data-x="${i}" class="text-xs text-slate-400 hover:text-red-400" aria-label="Hapus dokumen">✕</button>`;
    l.appendChild(r);
  });
}
$('listDok').addEventListener('click', e => {
  const v = e.target.closest('[data-v]'), x = e.target.closest('[data-x]');
  if (v) lihat(S.dok[v.dataset.v]);
  if (x) { URL.revokeObjectURL(S.dok[x.dataset.x].url); S.dok.splice(x.dataset.x, 1); renderDok(); }
});
$('listDok').addEventListener('input', e => {
  if (e.target.dataset.n !== undefined) S.dok[e.target.dataset.n].name = e.target.value;
});
$('btnDok').onclick = () => $('inDok').click();
$('inDok').onchange = e => {
  for (const f of e.target.files) {
    if (!['.doc', '.docx', '.xls', '.xlsx', '.pdf', '.jpg', '.jpeg', '.png'].includes(ext(f))) { toast(f.name + ': hanya Word, Excel, PDF, JPG, atau PNG.'); continue; }
    if (S.dok.length >= MAX) { toast('Maksimal 4 dokumen.'); break; }
    S.dok.push({ file: f, url: URL.createObjectURL(f), name: baseName(f) });
  }
  e.target.value = ''; renderDok();
};

/* ---------- KIRIM WA ---------- */
function tampilTerkirim() {
  const box = $('listLihat'); box.innerHTML = '';
  if (!S.dok.length) { box.innerHTML = '<p class="text-xs text-slate-400">Tidak ada dokumen.</p>'; }
  S.dok.forEach((d, i) => {
    const b = document.createElement('button');
    b.className = 'w-full flex items-center justify-between p-3 bg-slate-800 hover:bg-slate-700 rounded-xl border border-slate-700 text-left';
    b.innerHTML = `<span class="text-xs font-bold truncate">${ikon(d.file)} ${esc(d.name || 'Dokumen ' + (i + 1))}</span><span class="text-xs text-blue-400">Lihat</span>`;
    b.onclick = () => lihat(d);
    box.appendChild(b);
  });
  $('terkirim').classList.remove('hidden');
  $('terkirim').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

$('btnKirim').onclick = async () => {
  const judul = $('judul').value.trim() || 'Laporan Kegiatan';
  if (!S.foto.length && !S.dok.length) { toast('Tambahkan minimal 1 foto atau dokumen dulu.'); return; }

  const daftarDok = S.dok.map((d, i) => `${i + 1}. ${d.name || 'Dokumen ' + (i + 1)}`).join('\n');
  const tgl = fmtTgl();
  const teks = `*${judul}*\n${tgl ? '📅 ' + tgl + '\n' : ''}Laporan kegiatan: ${S.foto.length} foto, ${S.dok.length} dokumen.` + (daftarDok ? `\n\nDokumen:\n${daftarDok}` : '');

  const files = [
    ...S.foto.map((p, i) => new File([p.file], `${(p.cap || 'foto ' + (i + 1)).trim()}${ext(p.file) || '.jpg'}`, { type: p.file.type })),
    ...S.dok.map((d, i) => new File([d.file], `${(d.name || 'dokumen ' + (i + 1)).trim()}${ext(d.file)}`, { type: d.file.type }))
  ];

  try {
    if (navigator.canShare && navigator.canShare({ files })) {
      await navigator.share({ files, title: judul, text: teks });
    } else {
      window.open('https://wa.me/?text=' + encodeURIComponent(teks), '_blank');
      toast('Perangkat ini tidak bisa kirim file langsung. Lampirkan file secara manual di WhatsApp.');
    }
    tampilTerkirim();
  } catch (err) {
    if (err.name !== 'AbortError') toast('Gagal membagikan: ' + err.message);
  }
};

/* ---------- TANGGAL & WARNA ---------- */
const PRESET = [
  ['#4f46e5', '#9333ea', 'Ungu'], ['#059669', '#0d9488', 'Hijau'], ['#e11d48', '#be185d', 'Merah'],
  ['#d97706', '#b45309', 'Oranye'], ['#0284c7', '#4f46e5', 'Biru'], ['#334155', '#0f172a', 'Abu gelap']
];
const cfg = {};
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const darken = (h, f) => '#' + rgb(h).map(v => Math.round(v * (1 - f)).toString(16).padStart(2, '0')).join('');
const lum = h => { const [r, g, b] = rgb(h); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
function simpan() { try { localStorage.setItem('posterCfg', JSON.stringify(cfg)); } catch (e) {} }

function setWarna(c1, c2) {
  c2 = c2 || darken(c1, 0.35);
  const r = document.documentElement.style;
  r.setProperty('--c1', c1); r.setProperty('--c2', c2);
  r.setProperty('--ht', lum(c1) > 0.6 ? '#0f172a' : '#ffffff');
  cfg.c1 = c1; cfg.c2 = c2; simpan();
}
PRESET.forEach(([a, b, nama]) => {
  const t = document.createElement('button');
  t.type = 'button'; t.title = nama; t.setAttribute('aria-label', 'Warna ' + nama);
  t.className = 'w-7 h-7 rounded-full border-2 border-white/70 hover:scale-110 transition';
  t.style.background = `linear-gradient(135deg,${a},${b})`;
  t.onclick = () => { setWarna(a, b); $('warnaSendiri').value = a; };
  $('warna').appendChild(t);
});
$('warnaSendiri').oninput = e => setWarna(e.target.value);

function fmtTgl() {
  const a = $('tgl1').value, b = $('rentang').checked ? $('tgl2').value : '';
  if (!a) return '';
  const opt = { day: 'numeric', month: 'long', year: 'numeric' };
  let x = new Date(a + 'T00:00'), y = b ? new Date(b + 'T00:00') : null;
  if (!y || +x === +y) return x.toLocaleDateString('id-ID', opt);
  if (y < x) [x, y] = [y, x];
  if (x.getMonth() === y.getMonth() && x.getFullYear() === y.getFullYear())
    return `${x.getDate()} – ${y.toLocaleDateString('id-ID', opt)}`;
  return `${x.toLocaleDateString('id-ID', opt)} – ${y.toLocaleDateString('id-ID', opt)}`;
}
function updTgl() {
  const r = $('rentang').checked;
  $('tgl2').classList.toggle('hidden', !r); $('sampai').classList.toggle('hidden', !r);
  const t = fmtTgl();
  $('tglTeks').textContent = '📅 ' + (t || 'Pilih tanggal kegiatan');
  cfg.t1 = $('tgl1').value; cfg.t2 = $('tgl2').value; cfg.r = r; cfg.j = $('judul').value; simpan();
}
['tgl1', 'tgl2', 'rentang', 'judul'].forEach(id => $(id).addEventListener('input', updTgl));

try {
  Object.assign(cfg, JSON.parse(localStorage.getItem('posterCfg') || '{}'));
  if (cfg.c1) { setWarna(cfg.c1, cfg.c2); $('warnaSendiri').value = cfg.c1; }
  if (cfg.j) $('judul').value = cfg.j;
  if (cfg.t1) $('tgl1').value = cfg.t1;
  if (cfg.t2) $('tgl2').value = cfg.t2;
  $('rentang').checked = !!cfg.r;
} catch (e) {}
updTgl();

renderFoto(); renderDok();
</script>
</body>
</html>
